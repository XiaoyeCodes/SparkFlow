<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SparkFlow README cover</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050b10;color:#eef4f8;font-family:"Segoe UI","Microsoft YaHei",sans-serif}
main{width:1400px;height:560px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 28% 75%,#102d4233,transparent 60%),linear-gradient(125deg,#050a0d,#08131b 63%,#070e13);border:1px solid #19313b}
main:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#57849c08 1px,transparent 1px),linear-gradient(90deg,#57849c08 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(90deg,#000,transparent 75%)}
.earth{position:absolute;left:-80px;top:-40px;width:760px;height:608px}.earth>div{position:absolute;inset:0;width:100%;height:100%}
.copy{position:absolute;left:630px;right:60px;top:64px}.eyebrow{display:flex;align-items:center;gap:12px;color:#8faebe;font-size:13px;letter-spacing:3px}.eyebrow img{width:46px;height:46px;object-fit:contain}
h1{font-size:80px;line-height:1.12;letter-spacing:-3px;margin:20px 0 17px;font-weight:650}h2{font-size:40px;line-height:1.35;letter-spacing:1px;margin:0 0 22px;font-weight:550}h2 span{color:#8ecbb9}
p{color:#9fb0bc;line-height:1.9;font-size:18px;margin:0}.capabilities{border-top:1px solid #29414d;margin-top:28px;padding-top:20px;display:flex;gap:29px;color:#c9dce5;font-size:14px}.capabilities span{white-space:nowrap}.capabilities b{font-size:10px;letter-spacing:2px;display:block;color:#6e929e;margin-bottom:7px;font-weight:500}
.foot{position:absolute;bottom:24px;left:34px;color:#7297a6;font-size:10px;letter-spacing:3px}.line{position:absolute;width:72px;height:2px;background:#83cfb5;bottom:0;left:0}
</style>
<main>
  <div id="earth" class="earth"></div>
  <div class="copy">
    <div class="eyebrow"><img src="/brand/lumenary-mark-v2-transparent.png" alt="">GLOBAL MARKET INTELLIGENCE</div>
    <h1>SparkFlow</h1>
    <h2>全球市场，<span>一处洞察。</span></h2>
    <p>从宏观全景到风险因子，从 AI 研究到模拟验证。<br>把全球市场的信号，连接成自己的研究工作流。</p>
    <div class="capabilities"><span><b>OBSERVE</b>全球市场</span><span><b>UNDERSTAND</b>风险雷达</span><span><b>RESEARCH</b>AI 研究</span><span><b>VALIDATE</b>模拟交易</span></div>
  </div>
  <div class="foot">LOCAL FIRST &nbsp; / &nbsp; OPEN SOURCE &nbsp; / &nbsp; BUILT FOR RESEARCH</div><div class="line"></div>
</main>
<script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import {EarthScene} from '/src/components/EarthScene.tsx';
createRoot(document.getElementById('earth')).render(React.createElement(EarthScene));
</script>
</html>
