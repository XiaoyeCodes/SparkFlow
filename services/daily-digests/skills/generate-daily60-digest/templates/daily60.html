<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><meta name="supported-color-schemes" content="light">
<title>每日60秒 · {{DATE}}</title>
<style>
body{margin:0;padding:0;-webkit-text-size-adjust:100%}table{border-collapse:collapse}a{color:#282622}
@media only screen and (max-width:480px){.outer{padding:16px 10px!important}.masthead{padding:25px 24px 26px!important}.content{padding:7px 24px 0!important}.footer{padding:24px 24px 30px!important}.headline{font-size:31px!important;letter-spacing:0!important}.geometry{width:105px!important;height:88px!important}.geometry-cell{width:105px!important}.story{padding:14px 0!important}.number{width:35px!important}.date-line{font-size:12px!important;letter-spacing:0!important}}
</style>
</head>
<body style="margin:0;padding:0;background-color:#efede7;color:#282622;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;">
<div style="display:none!important;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">{{DATE_CN}} · 每日60秒 · {{COUNT}}条新闻速读</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#efede7"><tr><td class="outer" align="center" style="padding:40px 20px;">
<!--[if mso]><table role="presentation" width="640" align="center" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
<table role="presentation" class="paper" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#FCFAF6" style="width:100%;max-width:640px;background-color:#FCFAF6;border:1px solid #ded6c8;">
<tr><td class="masthead" bgcolor="#F1E8D8" style="padding:30px 44px 29px;background-color:#F1E8D8;border-top:2px solid #8b7b65;border-bottom:1px solid #C8BCAA;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:10px;font-weight:600;line-height:22px;letter-spacing:2.2px;color:#827563;">DAILY 60</td><td align="right" style="font-size:10px;line-height:22px;letter-spacing:1px;color:#827563;">NEWS BRIEF</td></tr></table>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top:20px;"><tr><td valign="middle"><h1 class="headline" style="margin:0;font-size:39px;line-height:1.35;font-weight:600;letter-spacing:1px;color:#282622;">每日60秒</h1><p style="margin:8px 0 0;font-size:14px;line-height:1.8;letter-spacing:3px;color:#827563;">新闻速读</p></td>{{HEADER_ART}}</tr></table>
<p class="date-line" style="margin:21px 0 0;font-size:13px;line-height:1.8;color:#827563;letter-spacing:0.4px;">{{DATE_CN}} <span style="color:#ad9b80;">&nbsp; / &nbsp;</span> {{WEEKDAY}} <span style="color:#ad9b80;">&nbsp; / &nbsp;</span> {{COUNT}} 条新闻</p>
<p class="lunar-line" style="margin:6px 0 0;font-size:13px;line-height:1.8;color:#827563;letter-spacing:0.4px;">农历 · {{LUNAR_DATE}}</p>
</td></tr>
<tr><td class="content" bgcolor="#FCFAF6" style="padding:9px 44px 0;background-color:#FCFAF6;">
<table role="presentation" class="news-list" width="100%" cellpadding="0" cellspacing="0" border="0">{{NEWS_ROWS}}</table>
</td></tr>
{{DAILY_TIP}}
<tr><td class="footer" bgcolor="#FCFAF6" style="padding:27px 44px 34px;background-color:#FCFAF6;">
<div style="border-top:1px solid #C8BCAA;padding-top:23px;">
<p style="margin:0;font-size:12px;line-height:1.8;color:#827563;">来源：60s 每日新闻 · {{DATE}}</p>
</div></td></tr>
</table>
<!--[if mso]></td></tr></table><![endif]-->
</td></tr></table>
